server {
  listen 8080;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  charset utf-8;

  gzip on;
  gzip_comp_level 6;
  gzip_min_length 1024;
  gzip_types
    text/plain
    text/css
    text/markdown
    application/javascript
    application/json
    application/xml
    image/svg+xml;

  # Astro hashed assets — long-term cache
  location /_astro/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # Markdown sources for AI agents (llms.txt and per-page .md)
  location ~* \.(md|txt)$ {
    default_type text/markdown;
    add_header Content-Type "text/markdown; charset=utf-8";
    add_header Access-Control-Allow-Origin "*";
    add_header Cache-Control "public, max-age=300";
    try_files $uri =404;
  }

  # HTML — short cache, allow stale-while-revalidate via CDN if any
  location / {
    add_header Cache-Control "public, max-age=300";
    try_files $uri $uri/ $uri.html /404.html;
  }

  # Healthcheck
  location = /healthz {
    access_log off;
    add_header Content-Type "text/plain";
    return 200 "ok\n";
  }
}
