name = "plateau-tiles"
main = "src/index.ts"
compatibility_date = "2026-07-07"
workers_dev = false

# A single host serves several datasets, split by the first path segment. Each
# dataset maps to an R2 bucket via PATH_BUCKETS below, so adding a dataset is
# config-only (a bucket binding + a PATH_BUCKETS entry) — no code change.
[[routes]]
pattern = "tiles.plateau.city/*"
zone_name = "plateau.city"

[[r2_buckets]]
binding = "TERRAIN"
bucket_name = "plateau-terrain"

[[r2_buckets]]
binding = "ORTHO"
bucket_name = "plateau-ortho"

[vars]
# CORS allow-list. "*" allows any origin (tiles are public).
CORS_ALLOW_ORIGIN = "*"
# First path segment -> R2 binding name. The handler resolves env[binding], so a
# new dataset only needs an entry here plus a matching r2_buckets binding.
PATH_BUCKETS = { terrain = "TERRAIN", ortho = "ORTHO" }
# Datasets whose `config.json` emits a DEM overlay stack (type: "dem") rather
# than raster sources. Comma-separated; no query param needed.
DEM_DATASETS = "terrain"
# DEM dataset -> geoid model, emitted as `geoid` in that dataset's config.json.
# States the vertical datum in the data instead of relying on the tile server's
# TERRAIN_DEFAULT_GEOID, which matters once a JGD2024 dataset (jpgeo2024-hrefconv)
# sits next to the JGD2011 one. An unlisted dataset emits nothing and keeps the
# server default.
DEM_GEOIDS = { terrain = "gsigeo2011" }

# Extra DEM sources declared per dataset (dataset -> source name -> fields).
# Each one is emitted alongside the requested source in every
# `/<dataset>/config.json` (so the tile server picks it up from the URL it already
# reads); `?name=<that name>` returns just that source. The requested source
# itself (default `dem`, `plateau-terrain-experimental`, ...) is unchanged.
# This one declares a JGD2024 view of the JGD2011 COG
# stack: the tile server adds the JGD2011->JGD2024 height correction (dH) to each
# layer and uses the JGD2024 geoid. `base = "sealevel"`: the JGD2024
# source sits on the flat 0 m base (never corrected) instead of the shared
# Mapterhorn base, so no upstream DEM of another datum shows through its gaps.
[vars.DEM_PROFILES.terrain.plateau-terrain-jgd2024]
geoid = "jpgeo2024-hrefconv"
verticalDatum = "jgd2011"
base = "sealevel"
heightCorrection = { manifest = "https://tiles.plateau.city/terrain/vertical/hyokorev-jgd2011-to-jgd2024/v1/manifest.json", missing = "keep" }

[observability]
enabled = true

[observability.logs]
head_sampling_rate = 1
