# i-UR 3.2 -> i-UR 4.0, over CityGML 2.0 -> 3.0 (PLATEAU).
#
# One profile per source i-UR version. The versions do not declare the same
# elements -- 3.0 and 3.1 differ by 143 element declarations, and five of the
# names they share changed the type they hold -- so a single profile covering all
# of them would have to pretend they are interchangeable. They are not.
#
# The converter picks this file by reading the i-UR namespaces the input declares.
# Running it against a different version is refused rather than half-applied.
#
# What is left here is only the part that is specific to i-UR 3.2. The two
# halves that are not -- the CityGML 2.0 -> 3.0 mapping, and everything about
# producing i-UR 4.0 -- are the fragments named in `base`, folded in ahead of
# this file's own rules. A rule that is not version-specific belongs in one of
# them rather than here. Put it here and the sibling profiles silently do
# without it.
#
# The two sides must stay disjoint. A key this file and a fragment both declare
# is refused at load rather than resolved by precedence, because there is no
# reading of "the CityGML fragment and the i-UR profile disagree" that is not a
# mistake in one of them.
#
# Names are written `prefix:local`. Prefixes on the `from` side resolve through
# [input.namespaces], prefixes on the `to` side through [output.namespaces].
# Both are merged across the fragments before any name is resolved.
#
# Anything marked UNVERIFIED below could not be confirmed against a source. The
# sources are not in this repo, so ask for them before changing a rule.

name = "iur-3.2-to-4.0"
description = "PLATEAU CityGML 2.0 + i-UR 3.2 -> CityGML 3.0 + i-UR 4.0, building module"
base = ["citygml-2.0-to-3.0", "iur-4.0-target"]

# What this profile accepts and what it produces. `iur` lists the exact
# source namespaces that identify a document as belonging to this profile.
# The converter matches an input against them to choose a profile, and
# refuses a mismatch instead of converting half of it.
[source]
label = "CityGML 2.0 + i-UR 3.2"
citygml = "http://www.opengis.net/citygml/2.0"
iur_version = "3.2"
iur = [
  "https://www.geospatial.jp/iur/uro/3.2",
  "https://www.geospatial.jp/iur/urf/3.2",
  "https://www.geospatial.jp/iur/urg/3.2",
  "https://www.geospatial.jp/iur/urt/3.2",
]

# The i-UR 3.2 input prefixes. The CityGML ones are in `citygml-2.0-to-3.0`.
[input.namespaces]
# This profile converts i-UR 3.2 only. A sibling profile covers each other
# minor version, and the converter picks between them from the input itself.
uro = "https://www.geospatial.jp/iur/uro/3.2"
urf = "https://www.geospatial.jp/iur/urf/3.2"
urg = "https://www.geospatial.jp/iur/urg/3.2"
urt = "https://www.geospatial.jp/iur/urt/3.2"

# The i-UR half of the bulk namespace bump. The CityGML rows are in
# `citygml-2.0-to-3.0`, and fold in ahead of these.
[namespace_map]
# i-UR 3.2 -> 4.0. Only this one version is listed, and a namespace absent from
# this table passes through unmapped, which is exactly the outcome wanted if
# a document from another version somehow reaches this profile.
"https://www.geospatial.jp/iur/uro/3.2" = "https://www.geospatial.jp/iur/uro/4.0"
"https://www.geospatial.jp/iur/urf/3.2" = "https://www.geospatial.jp/iur/urf/4.0"
"https://www.geospatial.jp/iur/urg/3.2" = "https://www.geospatial.jp/iur/urg/4.0"
"https://www.geospatial.jp/iur/urt/3.2" = "https://www.geospatial.jp/iur/urt/4.0"

# ---------------------------------------------------------------------------
# i-UR decisions the schemas cannot make.
#
# Everything below is a choice, and everything in the generated block further
# down is read off the schemas. Rules here win, and the generator skips any name
# already ruled on above it.
# ---------------------------------------------------------------------------

# The quality attribute. urc:DataQualityAttribute is concrete, so it would
# validate, but 3.0 data published for PLATEAU uses the Exterior variant --
# these are outdoor city models. An indoor dataset wants
# urc:InteriorDataQualityAttribute instead, which is a change to this one rule.
[[element]]
from = "uro:DataQualityAttribute"
to = "urc:ExteriorDataQualityAttribute"

