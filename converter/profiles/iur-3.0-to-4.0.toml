# i-UR 3.0 -> i-UR 4.0, over CityGML 2.0 -> 3.0 (PLATEAU).
#
# One profile per source i-UR version. The versions do not declare the same
# elements -- 3.0 and 3.1 differ by 143 element declarations, and five of the
# names they share changed the type they hold -- so a single profile covering all
# of them would have to pretend they are interchangeable. They are not.
#
# The converter picks this file by reading the i-UR namespaces the input declares.
# Running it against a different version is refused rather than half-applied.
#
# What is left here is only the part that is specific to i-UR 3.0. The two
# halves that are not -- the CityGML 2.0 -> 3.0 mapping, and everything about
# producing i-UR 4.0 -- are the fragments named in `base`, folded in ahead of
# this file's own rules. A rule that is not version-specific belongs in one of
# them, not here: put it here and the sibling profiles silently do without it.
#
# The two sides must stay disjoint. A key this file and a fragment both declare
# is refused at load rather than resolved by precedence, because there is no
# reading of "the CityGML fragment and the i-UR profile disagree" that is not a
# mistake in one of them.
#
# Names are written `prefix:local`. Prefixes on the `from` side resolve through
# [input.namespaces], prefixes on the `to` side through [output.namespaces];
# both are merged across the fragments before any name is resolved.
#
# Anything marked UNVERIFIED below could not be confirmed against a source. The
# sources are not in this repo; ask for them before changing a rule.

name = "iur-3.0-to-4.0"
description = "PLATEAU CityGML 2.0 + i-UR 3.0 -> CityGML 3.0 + i-UR 4.0, building module"
base = ["citygml-2.0-to-3.0", "iur-4.0-target"]

# What this profile accepts and what it produces. `iur` lists the exact
# source namespaces that identify a document as belonging to this profile;
# the converter matches an input against them to choose a profile, and
# refuses a mismatch instead of converting half of it.
[source]
label = "CityGML 2.0 + i-UR 3.0"
citygml = "http://www.opengis.net/citygml/2.0"
iur_version = "3.0"
iur = [
  "https://www.geospatial.jp/iur/uro/3.0",
  "https://www.geospatial.jp/iur/urf/3.0",
  "https://www.geospatial.jp/iur/urg/3.0",
  "https://www.geospatial.jp/iur/urt/3.0",
]

# The i-UR 3.0 input prefixes. The CityGML ones are in `citygml-2.0-to-3.0`.
[input.namespaces]
# This profile converts i-UR 3.0 only. A sibling profile covers each other
# minor version; the converter picks between them from the input itself.
uro = "https://www.geospatial.jp/iur/uro/3.0"
urf = "https://www.geospatial.jp/iur/urf/3.0"
urg = "https://www.geospatial.jp/iur/urg/3.0"
urt = "https://www.geospatial.jp/iur/urt/3.0"

# The i-UR half of the bulk namespace bump. The CityGML rows are in
# `citygml-2.0-to-3.0`, and fold in ahead of these.
[namespace_map]
# i-UR 3.0 -> 4.0. Only this one version is listed: a namespace absent from
# this table passes through unmapped, which is exactly the outcome wanted if
# a document from another version somehow reaches this profile.
"https://www.geospatial.jp/iur/uro/3.0" = "https://www.geospatial.jp/iur/uro/4.0"
"https://www.geospatial.jp/iur/urf/3.0" = "https://www.geospatial.jp/iur/urf/4.0"
"https://www.geospatial.jp/iur/urg/3.0" = "https://www.geospatial.jp/iur/urg/4.0"
"https://www.geospatial.jp/iur/urt/3.0" = "https://www.geospatial.jp/iur/urt/4.0"

# ---------------------------------------------------------------------------
# i-UR decisions the schemas cannot make.
#
# Everything below is a choice; everything in the generated block further down is
# read off the schemas. Rules here win: the generator skips any name already
# ruled on above it.
# ---------------------------------------------------------------------------

# The quality attribute. urc:DataQualityAttribute is concrete, so it would
# validate, but 3.0 data published for PLATEAU uses the Exterior variant --
# these are outdoor city models. An indoor dataset wants
# urc:InteriorDataQualityAttribute instead, which is a change to this one rule.
[[element]]
from = "uro:DataQualityAttribute"
to = "urc:ExteriorDataQualityAttribute"

# i-UR 3.0 records data quality without a LOD: a single srcScale,
# geometrySrcDesc and appearanceSrcDesc for the whole feature. Every urc 4.0
# counterpart is LOD-specific, and nothing in the data says which LOD the flat
# value describes, so these are dropped rather than assigned to a guessed LOD.
# Only i-UR 3.0 data is affected; 3.1 onwards already records per-LOD values.
[[element]]
from = "uro:srcScale"
drop = true
[[element]]
from = "uro:geometrySrcDesc"
drop = true
[[element]]
from = "uro:appearanceSrcDesc"
drop = true

# i-UR 3.0 declares a separate attribute class per feature type --
# BuildingTsunamiRiskAttribute, WaterBodyRiverFloodingRiskAttribute and so on.
# i-UR 3.1 merged them into one generic class each, and 4.0 keeps only the
# generic form, so the conversion is to strip the feature-type prefix.
#
# This is inferred, not stated: no schema records that
# BuildingTsunamiRiskAttribute *became* TsunamiRiskAttribute. What supports it is
# that 3.1 performed exactly this merge, and that every stripped name is declared
# by urc 4.0. The quality classes follow the Exterior decision made above.
#
# 3.0 only. From 3.1 onwards the data already uses the generic classes.
[[element]]
from = "uro:BuildingDataQualityAttribute"
to = "urc:ExteriorDataQualityAttribute"
[[element]]
from = "uro:BuildingDisasterRiskAttribute"
to = "urc:DisasterRiskAttribute"
[[element]]
from = "uro:BuildingFloodingRiskAttribute"
to = "urc:FloodingRiskAttribute"
[[element]]
from = "uro:BuildingHighTideRiskAttribute"
to = "urc:HighTideRiskAttribute"
[[element]]
from = "uro:BuildingInlandFloodingRiskAttribute"
to = "urc:InlandFloodingRiskAttribute"
[[element]]
from = "uro:BuildingLandSlideRiskAttribute"
to = "urc:LandSlideRiskAttribute"
[[element]]
from = "uro:BuildingRiverFloodingRiskAttribute"
to = "urc:RiverFloodingRiskAttribute"
[[element]]
from = "uro:BuildingTsunamiRiskAttribute"
to = "urc:TsunamiRiskAttribute"
[[element]]
from = "uro:CityFurnitureDataQualityAttribute"
to = "urc:ExteriorDataQualityAttribute"
[[element]]
from = "uro:ConstructionDataQualityAttribute"
to = "urc:ExteriorDataQualityAttribute"
[[element]]
from = "uro:LandUseDataQualityAttribute"
to = "urc:ExteriorDataQualityAttribute"
[[element]]
from = "uro:RoomDataQualityAttribute"
to = "urc:ExteriorDataQualityAttribute"
[[element]]
from = "uro:TransportationDataQualityAttribute"
to = "urc:ExteriorDataQualityAttribute"
[[element]]
from = "uro:VegetationDataQualityAttribute"
to = "urc:ExteriorDataQualityAttribute"
[[element]]
from = "uro:WaterBodyFloodingRiskAttribute"
to = "urc:FloodingRiskAttribute"
[[element]]
from = "uro:WaterBodyHighTideRiskAttribute"
to = "urc:HighTideRiskAttribute"
[[element]]
from = "uro:WaterBodyInlandFloodingRiskAttribute"
to = "urc:InlandFloodingRiskAttribute"
[[element]]
from = "uro:WaterBodyRiverFloodingRiskAttribute"
to = "urc:RiverFloodingRiskAttribute"
[[element]]
from = "uro:WaterBodyTsunamiRiskAttribute"
to = "urc:TsunamiRiskAttribute"

