name: build-tile
on:
  workflow_call:
    outputs:
      image:
        value: ${{ jobs.build-tile.outputs.image }}
      latest_tag:
        value: ${{ jobs.build-tile.outputs.latest_tag }}

jobs:
  build-tile:
    runs-on: ubuntu-latest
    env:
      IMAGE_NAME: ghcr.io/eukarya-inc/plateau-view/plateauview-tile
    outputs:
      image: ${{ steps.set-tags.outputs.build_tag }}
      latest_tag: ${{ steps.set-tags.outputs.latest_tag }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Set tags
        id: set-tags
        run: |
          echo "build_tag=${{ env.IMAGE_NAME }}:build-${{ github.sha }}" >> $GITHUB_OUTPUT
          echo "latest_tag=${{ env.IMAGE_NAME }}:latest" >> $GITHUB_OUTPUT
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push docker image with temporary tag
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f # v7.1.0
        id: docker
        with:
          context: ./tile
          platforms: linux/amd64
          tags: ${{ steps.set-tags.outputs.build_tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          push: true
