name: build-cms-worker
on:
  workflow_call:
    inputs:
      worker:
        description: 'Run worker build'
        default: 'false'
        type: string

jobs:
  build-image-worker:
    runs-on: ubuntu-latest
    name: Build and push Docker image for cms-worker
    if: ${{ inputs.worker == 'true' }}
    permissions:
      contents: read
      packages: write
    env:
      IMAGE_NAME: ghcr.io/eukarya-inc/plateau-view/plateauview-cms-worker:latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push docker image
        uses: docker/build-push-action@v6
        id: build-push-image
        with:
          context: ./cms/worker
          platforms: linux/amd64
          tags: ${{ env.IMAGE_NAME }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          push: true

  build-image-decompressor:
    runs-on: ubuntu-latest
    name: Build and push Docker image for cms-decompressor
    if: ${{ inputs.worker == 'true' }}
    permissions:
      contents: read
      packages: write
    env:
      IMAGE_NAME: ghcr.io/eukarya-inc/plateau-view/plateauview-cms-decompressor:latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push docker image
        uses: docker/build-push-action@v6
        id: build-push-image
        with:
          context: ./cms/worker
          file: decompressor.Dockerfile
          platforms: linux/amd64
          tags: ${{ env.IMAGE_NAME }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          push: true

  build-image-copier:
    runs-on: ubuntu-latest
    name: Build and push Docker image for cms-copier
    if: ${{ inputs.worker == 'true' }}
    permissions:
      contents: read
      packages: write
    env:
      IMAGE_NAME: ghcr.io/eukarya-inc/plateau-view/plateauview-cms-copier:latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push docker image
        uses: docker/build-push-action@v6
        id: build-push-image
        with:
          context: ./cms/worker
          file: copier.Dockerfile
          platforms: linux/amd64
          tags: ${{ env.IMAGE_NAME }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          push: true
