name: push-image
on:
  workflow_call:
    inputs:
      build_tag:
        description: 'Build tag to pull (e.g., repo:build-sha)'
        required: true
        type: string
      latest_tag:
        description: 'Latest tag to push (e.g., repo:latest)'
        required: true
        type: string

jobs:
  push-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2
        with:
          egress-policy: audit
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0
      - name: Create latest tag from build tag
        run: |
          BUILD_TAG="${{ inputs.build_tag }}"
          LATEST_TAG="${{ inputs.latest_tag }}"
          # Use buildx imagetools to create the tag directly in the registry
          # This avoids local Docker daemon caching issues
          docker buildx imagetools create -t "$LATEST_TAG" "$BUILD_TAG"
          # Verify the tag was created correctly
          echo "Verifying created tag..."
          docker buildx imagetools inspect "$LATEST_TAG"
