name: build-skills-dist

# Maintains the `skills-dist` branch with the agentskills.io-compatible layout
# expected by `gh skill install Project-PLATEAU/skills`.
# Commits accumulate on the branch so the history matches main's release order.
#
# Manual release flow:
#   git fetch origin skills-dist
#   git push git@github.com:Project-PLATEAU/skills.git \
#     refs/remotes/origin/skills-dist:refs/heads/main

on:
  push:
    branches: [main]
    paths:
      - 'skills/**'
      - '.github/workflows/build-skills-dist.yml'
  workflow_dispatch:

concurrency:
  group: build-skills-dist
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2
        with:
          egress-policy: audit
      - name: Checkout skills-dist (or bootstrap an empty branch)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: skills-dist
          path: dist
          fetch-depth: 1
        continue-on-error: true

      - name: Bootstrap dist worktree if branch is new
        run: |
          set -euo pipefail
          if [ ! -d dist/.git ]; then
            mkdir -p dist
            cd dist
            git init -q -b skills-dist
          fi

      - name: Checkout source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: source

      - name: Sync dist tree to match source/skills/
        run: |
          set -euo pipefail
          # Wipe all tracked dist content except .git, so removals propagate.
          find dist -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          # agentskills.io convention: skills/<name>/SKILL.md at the dist repo root.
          mkdir -p dist/skills
          rsync -a \
            --exclude='/README.md' \
            --exclude='/RELEASE.md' \
            source/skills/ dist/skills/
          cp source/skills/README.md dist/README.md

      - name: Commit & push
        working-directory: dist
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          SHA="${GITHUB_SHA}"
          SHORT="${SHA:0:7}"
          git commit -q -m "build: skills dist from main@${SHORT}

          Source: https://github.com/${GITHUB_REPOSITORY}/commit/${SHA}"
          if ! git remote get-url origin >/dev/null 2>&1; then
            git remote add origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git"
          else
            git remote set-url origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git"
          fi
          git push origin HEAD:skills-dist
