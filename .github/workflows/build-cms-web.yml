name: build-cms-web
on:
  workflow_call:
    inputs:
      web:
        description: 'Run web build'
        default: 'false'
        type: string

jobs:
  build-image-web:
    runs-on: ubuntu-latest
    name: Build and push Docker image for cms-web
    if: ${{ inputs.web == 'true' }}
    permissions:
      contents: read
      packages: write
    env:
      IMAGE_NAME: ghcr.io/eukarya-inc/plateau-view/plateauview-cms-web:latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push docker image
        uses: docker/build-push-action@v6
        id: build-push-image
        with:
          context: ./cms/web
          platforms: linux/amd64
          tags: ${{ env.IMAGE_NAME }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          push: true
