name: E2E test

on:
  workflow_dispatch:
    inputs:
      type:
        description: 'Test type'
        required: true
        default: 'smoke'
        type: choice
        options:
          - smoke
          - full
      base-url:
        description: 'Base URL for tests'
        required: false
        default: 'https://plateauview.mlit.go.jp'
        type: string

jobs:
  e2e:
    runs-on: ubuntu-latest # NOTE: use GPU runners for better performance
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: e2e/package-lock.json

      - name: Install dependencies
        working-directory: ./e2e
        run: npm ci

      - name: Install Playwright browsers
        working-directory: ./e2e
        run: |
          if [ "${{ inputs.type }}" = "smoke" ]; then
            npx playwright install webkit --with-deps
          else
            npx playwright install --with-deps
          fi

      - name: Run E2E tests
        working-directory: ./e2e
        env:
          BASE_URL: ${{ inputs.base-url }}
        run: |
          if [ "${{ inputs.type }}" = "smoke" ]; then
            echo "Running smoke tests with WebKit only"
            npm run test:smoke
          else
            echo "Running full tests with all browsers"
            npm test
          fi

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            e2e/playwright-report/
            e2e/test-results/
          retention-days: 7

      - name: Generate summary
        if: always()
        run: |
          echo "## E2E Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "### Test Configuration" >> $GITHUB_STEP_SUMMARY
          echo "- **Test Type**: ${{ inputs.type }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Base URL**: ${{ inputs.base-url }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "📊 [View detailed report in artifacts](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})" >> $GITHUB_STEP_SUMMARY
