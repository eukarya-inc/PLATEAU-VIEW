name: ⭐️ Deploy CMS dev
on:
  workflow_call:
  workflow_dispatch:
    inputs:
      target:
        type: choice
        description: "Deploy target (default: all)"
        required: false
        default: all
        options:
          - all
          - server
          - worker
          - web
env:
  CMS_IMAGE_NAME_GHCR: ghcr.io/eukarya-inc/plateau-view/plateauview-cms-api:latest
  CMS_IMAGE_NAME_GCP: asia-northeast1-docker.pkg.dev/reearth-plateau-dev/reearth-plateau/plateauview-cms-api:latest

  CMS_WEB_IMAGE_NAME_GHCR: ghcr.io/eukarya-inc/plateau-view/plateauview-cms-web:latest
  CMS_WEB_IMAGE_NAME_GCP: asia-northeast1-docker.pkg.dev/reearth-plateau-dev/reearth-plateau/plateauview-cms-web:latest

  CMS_WORKER_IMAGE_NAME_GHCR: ghcr.io/eukarya-inc/plateau-view/plateauview-cms-worker:latest
  CMS_WORKER_IMAGE_NAME_GCP: asia-northeast1-docker.pkg.dev/reearth-plateau-dev/reearth-plateau/plateauview-cms-worker:latest
concurrency:
  group: ${{ github.workflow }}
jobs:
  deploy_web:
    runs-on: ubuntu-latest
    environment: dev
    permissions:
      contents: read
      id-token: write
      packages: write
    if: github.event.repository.full_name == 'eukarya-inc/PLATEAU-VIEW' && (inputs.target == 'all' || inputs.target == 'web' || inputs.target == '')
    steps:
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
      - name: Configure docker
        run: gcloud auth configure-docker asia-northeast1-docker.pkg.dev --quiet
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Pull docker images
        run: docker pull $CMS_WEB_IMAGE_NAME_GHCR
      - name: Tag docker images
        run: docker tag $CMS_WEB_IMAGE_NAME_GHCR $CMS_WEB_IMAGE_NAME_GCP
      - name: Push docker images
        run: |
          docker push $CMS_WEB_IMAGE_NAME_GHCR
          docker push $CMS_WEB_IMAGE_NAME_GCP
      - name: Deploy
        run: |
          gcloud run deploy reearth-cms-web \
            --image $CMS_WEB_IMAGE_NAME_GCP \
            --region ${{ vars.GCP_REGION }} \
            --platform managed \
            --quiet

  deploy_server:
    runs-on: ubuntu-latest
    environment: dev
    permissions:
      contents: read
      id-token: write
      packages: write
    if: github.event.repository.full_name == 'eukarya-inc/PLATEAU-VIEW' && (inputs.target == 'all' || inputs.target == 'server' || inputs.target == '')
    steps:
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
      - name: Configure docker
        run: gcloud auth configure-docker asia-northeast1-docker.pkg.dev --quiet
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Pull docker images
        run: docker pull $CMS_IMAGE_NAME_GHCR
      - name: Tag docker images
        run: docker tag $CMS_IMAGE_NAME_GHCR $CMS_IMAGE_NAME_GCP
      - name: Push docker images
        run: docker push $CMS_IMAGE_NAME_GCP
      - name: Deploy
        run: |
          gcloud run deploy reearth-cms-api \
            --image $CMS_IMAGE_NAME_GCP \
            --region ${{ vars.GCP_REGION }} \
            --platform managed \
            --quiet

  deploy_worker:
    runs-on: ubuntu-latest
    environment: dev
    permissions:
      contents: read
      id-token: write
      packages: write
    if: github.event.repository.full_name == 'eukarya-inc/PLATEAU-VIEW' && (inputs.target == 'all' || inputs.target == 'worker' || inputs.target == '')
    steps:
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
      - name: Configure docker
        run: gcloud auth configure-docker asia-northeast1-docker.pkg.dev --quiet
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Pull docker images
        run: docker pull $CMS_WORKER_IMAGE_NAME_GHCR
      - name: Tag docker images
        run: docker tag $CMS_WORKER_IMAGE_NAME_GHCR $CMS_WORKER_IMAGE_NAME_GCP
      - name: Push docker images
        run: docker push $CMS_WORKER_IMAGE_NAME_GCP
      - name: Deploy
        run: |
          gcloud run deploy reearth-cms-worker \
            --image $CMS_WORKER_IMAGE_NAME_GCP \
            --region ${{ vars.GCP_REGION }} \
            --platform managed \
            --quiet
