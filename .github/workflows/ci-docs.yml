name: ci-docs
on:
  workflow_call:
jobs:
  ci-docs-build:
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2
        with:
          egress-policy: audit
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: docs/package-lock.json
      - name: Install
        working-directory: docs
        run: npm ci
      - name: Check OpenAPI snapshot is in sync with server/openapi/openapi.yml
        working-directory: docs
        run: |
          npm run api:gen
          if ! git diff --exit-code src/openapi/plateau-api.json; then
            echo "::error::docs/src/openapi/plateau-api.json is out of sync with server/openapi/openapi.yml. Run 'npm run api:gen' in docs/ and commit the result."
            exit 1
          fi
      - name: Build
        working-directory: docs
        run: npm run build
