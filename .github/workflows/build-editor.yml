name: build-editor
on:
  workflow_call:
    inputs:
      core:
        description: 'Run core build'
        default: 'false'
        type: string
      server:
        description: 'Run server build'
        default: 'false'
        type: string
      web:
        description: 'Run web build'
        default: 'false'
        type: string
    secrets:
      GH_APP_PRIVATE_KEY:
        description: 'GitHub App private key (required only when core=true)'
        required: false

jobs:
  build-core:
    runs-on: ubuntu-latest
    name: Build artifact for editor-core
    if: ${{ inputs.core == 'true' }}
    permissions:
      contents: write
    defaults:
      run:
        working-directory: 'editor/core'
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@v2.20.1
        with:
          egress-policy: audit
      - name: Checkout
        uses: actions/checkout@v6.0.2
        with:
          ref: ${{ github.head_ref }}
      - name: Generate app token
        id: app-token
        uses: actions/create-github-app-token@v3.1.1
        with:
          app-id: ${{ vars.GH_APP_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
      - name: Get GitHub App User ID
        id: get-user-id
        run: echo "user-id=$(gh api "/users/${{ steps.app-token.outputs.app-slug }}[bot]" --jq .id)" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
      - uses: actions/setup-node@v6.4.0
        with:
          node-version: lts/*
      - name: Get yarn cache directory path
        id: yarn-cache-dir-path
        run: echo "path=$(yarn config get cacheFolder)" >> $GITHUB_OUTPUT
      - uses: actions/cache@v5.0.5
        with:
          path: ${{ steps.yarn-cache-dir-path.outputs.path }}
          key: ${{ runner.os }}-yarn-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-
      - name: Run install
        run: yarn install --frozen-lockfile
      - name: Run build
        run: yarn build
      - name: Push build results
        uses: stefanzweifel/git-auto-commit-action@v7.1.0
        with:
          commit_author: "${{ steps.app-token.outputs.app-slug }}[bot] <${{ steps.get-user-id.outputs.user-id }}+${{ steps.app-token.outputs.app-slug }}[bot]@users.noreply.github.com>"
          commit_message: 'ci: build editor-core'
          commit_options: '--no-verify --signoff'
          commit_user_name: "${{ steps.app-token.outputs.app-slug }}[bot]"
          commit_user_email: "${{ steps.get-user-id.outputs.user-id }}+${{ steps.app-token.outputs.app-slug }}[bot]@users.noreply.github.com"
          push_options: '--force'
          file_pattern: 'editor/core/**'

  build-image-server:
    runs-on: ubuntu-latest
    name: Build and push Docker image for editor-server
    if: ${{ inputs.server == 'true' }}
    permissions:
      contents: read
      packages: write
    env:
      IMAGE_NAME: ghcr.io/eukarya-inc/plateau-view/reearth-visualizer-api:latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@v2.20.1
        with:
          egress-policy: audit
      - name: Checkout
        uses: actions/checkout@v6.0.2
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4.0.0
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.0.0
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4.1.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push docker image
        uses: docker/build-push-action@v7.1.0
        id: build-push-image
        with:
          context: ./editor/server
          platforms: linux/amd64
          tags: ${{ env.IMAGE_NAME }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          push: true

  build-image-web:
    runs-on: ubuntu-latest
    name: Build and push Docker image for editor-web
    if: ${{ inputs.web == 'true' }}
    permissions:
      contents: read
      packages: write
    env:
      IMAGE_NAME: ghcr.io/eukarya-inc/plateau-view/reearth-visualizer-web:latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@v2.20.1
        with:
          egress-policy: audit
      - name: Checkout
        uses: actions/checkout@v6.0.2
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4.0.0
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.0.0
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4.1.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push docker image
        uses: docker/build-push-action@v7.1.0
        id: build-push-image
        with:
          context: ./editor
          file: ./editor/web/Dockerfile
          platforms: linux/amd64
          tags: ${{ env.IMAGE_NAME }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          push: true

