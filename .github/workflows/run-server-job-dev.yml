name: 🔄 Run Server Job dev
on:
  workflow_dispatch:
    inputs:
      project:
        description: 'Project name(s) to generate cache for (e.g., plateau-2024 or plateau-2024,plateau-2023)'
        required: true
        type: string
env:
  JOB_NAME: plateauview-server-job
  OUTPUT_BUCKET: gs://plateau-dev-server-cache
jobs:
  run_job:
    runs-on: ubuntu-latest
    if: github.event.repository.full_name == 'eukarya-inc/PLATEAU-VIEW'
    environment: dev
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: google-github-actions/auth@v2
        with:
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
      - name: Execute Cloud Run Job
        run: |
          gcloud run jobs execute $JOB_NAME \
            --region ${{ vars.GCP_REGION }} \
            --args="--generate-datacatalog,${{ inputs.project }},--output,$OUTPUT_BUCKET" \
            --wait \
            --quiet
      - name: Check job status
        if: failure()
        run: |
          echo "Job execution failed. Check Cloud Run logs for details."
          gcloud run jobs executions list --job=$JOB_NAME --region=${{ vars.GCP_REGION }} --limit=1
