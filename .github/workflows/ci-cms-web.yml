name: ci-cms-web
on:
  workflow_call:
jobs:
  # validate-nginx-config:
  #   # Disabled: external workflow expects web/ at root, incompatible with monorepo structure
  #   uses: reearth/actions/.github/workflows/validate-nginx-config.yml@c8d4668fb6d90e6f877429e4c6421dfec8b39a91 # main
  #     template_directory: cms/web/docker
  #     template_values: '{"PORT": 8080, "REAL_IP_HEADER": "${{ vars.WEB_REAL_IP_HEADER }}"}' # Ref: https://github.com/reearth/reearth-cms/blob/main/web/Dockerfile#L35
  #     working_directory: cms/web

  ci:
    name: ci
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cms/web
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2
        with:
          egress-policy: audit
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: lts/*
          cache: yarn
          cache-dependency-path: 'cms/web/yarn.lock'
      - name: Install
        run: yarn install --frozen-lockfile
      - name: Lint
        run: yarn run lint
      - name: Test
        run: yarn run coverage
      - name: Send coverage report
        uses: codecov/codecov-action@57e3a136b779b570ffcdbf80b3bdc90e7fab3de2 # v6.0.0
        with:
          flags: web
      - name: Check translations
        run: yarn i18n --fail-on-update
      - name: Build
        run: yarn build
      - name: Pack
        if: github.ref_name == 'main' || github.ref_name == 'release'
        run: mv dist reearth-cms-web && tar -zcvf reearth-cms-web.tar.gz reearth-cms-web
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: github.ref_name == 'main' || github.ref_name == 'release'
        with:
          name: reearth-cms-web
          path: cms/web/reearth-cms-web.tar.gz
          if-no-files-found: error
