name: ci-cms-web
on:
  workflow_call:
jobs:
  # validate-nginx-config:
  #   # Disabled: external workflow expects web/ at root, incompatible with monorepo structure
  #   uses: reearth/actions/.github/workflows/validate-nginx-config.yml@e05fcd1efc6c985c7c0c906cff1452ee634232c8
  #   with:
  #     template_directory: cms/web/docker
  #     template_values: '{"PORT": 8080, "REAL_IP_HEADER": "${{ vars.WEB_REAL_IP_HEADER }}"}' # Ref: https://github.com/reearth/reearth-cms/blob/main/web/Dockerfile#L35
  #     working_directory: cms/web

  ci:
    name: ci
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cms/web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: yarn
          cache-dependency-path: '**/yarn.lock'
      - name: Enable Corepack
        run: corepack enable
      - name: Install
        run: yarn install
      - name: Lint
        run: yarn run lint
      - name: Test
        run: yarn run coverage
      - name: Send coverage report
        uses: codecov/codecov-action@v5
        with:
          flags: web
      - name: Check translations
        run: yarn i18n --fail-on-update
      - name: Build
        run: yarn build
      - name: Pack
        if: github.ref_name == 'main' || github.ref_name == 'release'
        run: mv dist reearth-cms-web && tar -zcvf reearth-cms-web.tar.gz reearth-cms-web
      - uses: actions/upload-artifact@v5
        if: github.ref_name == 'main' || github.ref_name == 'release'
        with:
          name: reearth-cms-web
          path: cms/web/reearth-cms-web.tar.gz
          if-no-files-found: error
