name: ci-cms-worker
on:
  workflow_call:
jobs:
  ci-server-lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: go setup
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: 'cms/worker/go.mod'
          check-latest: true
          cache-dependency-path: 'cms/worker/go.sum'
      - name: golangci-lint
        uses: golangci/golangci-lint-action@1e7e51e771db61008b38414a730f564565cf7c20 # v9.2.0
        with:
          version: v2.1.0
          working-directory: cms/worker
          args: --config=../.golangci.yml
          skip-cache: true
      - name: Check go.mod tidiness
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum
        working-directory: cms/worker
      - name: Check go fmt
        working-directory: cms/worker
        run: |
          go fmt ./
          git diff --exit-code ./
  ci-server-test:
    name: test
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:6-focal
        ports:
          - 27017:27017
    steps:
      - name: checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: go setup
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: 'cms/worker/go.mod'
          check-latest: true
          cache-dependency-path: 'cms/worker/go.sum'
      - name: test
        run: go test ./... -v -race -coverprofile=coverage.txt -covermode=atomic -timeout 10m
        working-directory: cms/worker
        env:
          REEARTH_CMS_DB: mongodb://localhost
