name: build-server
on:
  workflow_call:
    inputs:
      local:
        required: true
        type: boolean
    outputs:
      image:
        value: ${{ jobs.docker.outputs.image }}
jobs:
  docker:
    name: Build and push Docker image
    runs-on: ubuntu-latest
    env:
      IMAGE_NAME: ghcr.io/eukarya-inc/plateau-view/plateauview-api:latest
    outputs:
      image: ${{ env.IMAGE_NAME }}@sha256:${{ steps.docker.outputs.digest }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Download extension artifact
        uses: dawidd6/action-download-artifact@v6
        if: ${{ inputs.local != 'true' }}
        with:
          workflow_conclusion: ""
          branch: main
          name: extension
          path: server
          check_artifacts: true
          search_artifacts: true
      - name: Download extension artifact from the previous job
        uses: actions/download-artifact@v4
        if: ${{ inputs.local == 'true' }}
        with:
          name: extension
          path: server

      - name: Build docker image
        uses: docker/build-push-action@v3
        id: docker
        with:
          context: ./server
          platforms: linux/amd64
          tags: ${{ env.IMAGE_NAME }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          push: true
