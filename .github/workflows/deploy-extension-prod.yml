name: ⭐️ Deploy PLATEAU Extension production
on:
  workflow_call:
  workflow_dispatch:
env:
  GCS_DEST: gs://plateau-prod-reearth-static-bucket
  IMAGE: ghcr.io/eukarya-inc/plateau-view/plateauview-extension:latest
  # used by build
  PLATEAU_DEFAULT_GOOGLE_STREETVIEW_TOKEN: ${{ secrets.PLATEAU_DEFAULT_GOOGLE_STREETVIEW_TOKEN }}
  # used by build
  PLATEAU_ORIGIN: https://static.reearth.plateau.reearth.io/extension

jobs:
  deploy_extension:
    runs-on: ubuntu-latest
    if: github.event.repository.full_name == 'eukarya-inc/PLATEAU-VIEW'
    environment: prod
    permissions:
      contents: read
      id-token: write
      packages: write
    defaults:
      run:
        working-directory: extension
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@v2.20.1
        with:
          egress-policy: audit
      - uses: actions/checkout@v6.0.2
      - uses: actions/setup-node@v6.4.0
        with:
          node-version: 18.x
      - uses: docker/login-action@v4.1.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: google-github-actions/auth@v3.0.0
        with:
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
      - uses: google-github-actions/setup-gcloud@v3.0.1
      - name: Get yarn cache directory path
        id: yarn-cache-dir-path
        run: echo "::set-output name=dir::$(yarn cache dir)"
      - uses: actions/cache@v5.0.5
        id: yarn-cache # use this to check for `cache-hit` (`steps.yarn-cache.outputs.cache-hit != 'true'`)
        with:
          path: ${{ steps.yarn-cache-dir-path.outputs.dir }}
          key: ${{ runner.os }}-yarn-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-
      - name: Install
        run: yarn install --frozen-lockfile
      - name: Build
        run: yarn build
      - name: Deploy
        run: gsutil -m -h "Cache-Control:no-store" rsync -x "^estat/.*$" -dr dist ${{ env.GCS_DEST }}/extension
      - name: Pack extension
        run: tar -zcvf plateauview-extension.tar.gz dist
      - name: Save as artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: plateauview-extension
          path: extension/plateauview-extension.tar.gz
      - name: Save to Docker image
        run: tar -cf - dist | docker import - "$IMAGE" && docker push "$IMAGE"
