name: ⭐️ Deploy PLATEAU Docs production
on:
  workflow_call:
    inputs:
      image_tag:
        description: 'Image tag to deploy (e.g., build-abc123). Defaults to build-<sha>.'
        required: false
        type: string
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Image tag to deploy (e.g., build-abc123). Defaults to build-<sha>.'
        required: false
        type: string
env:
  IMAGE: ghcr.io/eukarya-inc/plateau-view/plateauview-docs:${{ inputs.image_tag || format('build-{0}', github.sha) }}
  IMAGE_GCP: asia-northeast1-docker.pkg.dev/reearth-plateau/reearth-plateau/plateauview-docs:latest
jobs:
  deploy_docs:
    runs-on: ubuntu-latest
    if: github.event.repository.full_name == 'eukarya-inc/PLATEAU-VIEW'
    environment: prod
    permissions:
      contents: read
      id-token: write
      packages: read
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2
        with:
          egress-policy: audit
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
      - name: Configure docker
        run: gcloud auth configure-docker asia-northeast1-docker.pkg.dev --quiet
      - name: Log in to GitHub Container Registry
        uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 # v4.0.0
        with:
          timeout_minutes: 5
          max_attempts: 3
          retry_wait_seconds: 10
          command: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0
      - name: Pull docker image from GHCR
        uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 # v4.0.0
        with:
          timeout_minutes: 10
          max_attempts: 3
          retry_wait_seconds: 10
          command: docker pull $IMAGE
      - name: Get pulled image digest
        id: digest
        run: |
          DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' $IMAGE | cut -d@ -f2)
          echo "digest=$DIGEST" >> $GITHUB_OUTPUT
          echo "Pulled image digest: $DIGEST"
      - name: Push image to GCP Artifact Registry
        run: |
          docker buildx imagetools create -t $IMAGE_GCP "$IMAGE"
          echo "Pushed to GCP: $IMAGE_GCP"
      - name: Deploy docs to Cloud Run
        run: |
          IMAGE_WITH_DIGEST="${IMAGE_GCP%:*}@${{ steps.digest.outputs.digest }}"
          echo "Deploying image: $IMAGE_WITH_DIGEST"
          gcloud run deploy plateauview-docs \
            --image "$IMAGE_WITH_DIGEST" \
            --region ${{ vars.GCP_REGION }} \
            --platform managed \
            --quiet
