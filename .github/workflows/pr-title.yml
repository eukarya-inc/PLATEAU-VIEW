name: PR Title Checker
on:
  pull_request_target:
    types:
      - opened
      - edited
      - synchronize
      - labeled
      - unlabeled
# below permissions are needed to allow forked PR creators to edit title: https://github.com/actions/labeler/issues/12#issuecomment-1095272652
permissions:
  checks: write
  contents: read
  pull-requests: write
jobs:
  pr_title:
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2
        with:
          egress-policy: audit
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/labeler@634933edcd8ababfe52f92936142cc22ac488b1b # v6.0.1
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ignoreLabels: meta
          scopes: |
            editor
            plugin
            server
            terrafom
          subjectPattern: ^(?![A-Z]).+$
          subjectPatternError: |
            The subject "{subject}" found in the pull request title "{title}"
            didn't match the configured pattern. Please ensure that the subject
            doesn't start with an uppercase character.
  contains_plugin_changes:
    needs: pr_title
    runs-on: ubuntu-latest
    outputs:
      plugin: ${{ steps.plugin.outputs.any_changed }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2
        with:
          egress-policy: audit
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: changed files for plugin
        id: plugin
        uses: step-security/changed-files@2e07db73e5ccdb319b9a6c7766bd46d39d304bad # v47.0.5
        with:
          files: |
            plugin/**
        continue-on-error: true
  pr_scope_check:
    needs: contains_plugin_changes
    if: ${{ !cancelled() && needs.contains_plugin_changes.outputs.plugin == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2
        with:
          egress-policy: audit
      - name: Check PR Scope and Keywords
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          title="$TITLE"
          contains_major=0
          contains_minor=0

          if [[ $title == *"major"* ]]; then
          contains_major=1
          fi

          if [[ $title == *"minor"* ]]; then
          contains_minor=1
          fi

          if [[ $contains_major -eq 0 && $contains_minor -eq 0 ]]; then
            echo "Error: The identified scope is 'plugin', but the 'major' or 'minor' keyword is missing from the title."
            exit 1
          fi
