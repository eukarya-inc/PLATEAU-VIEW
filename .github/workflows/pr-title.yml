name: PR Title Checker
on:
  pull_request:
    types:
      - opened
      - edited
      - synchronize
      - labeled
      - unlabeled
permissions:
  contents: read
  pull-requests: read
jobs:
  pr_title:
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@v2.20.1
        with:
          egress-policy: audit
      - uses: amannn/action-semantic-pull-request@v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ignoreLabels: meta
          scopes: |
            editor
            plugin
            server
            terrafom
          subjectPattern: ^(?![A-Z]).+$
          subjectPatternError: |
            The subject "{subject}" found in the pull request title "{title}"
            didn't match the configured pattern. Please ensure that the subject
            doesn't start with an uppercase character.
  contains_plugin_changes:
    needs: pr_title
    runs-on: ubuntu-latest
    outputs:
      plugin: ${{ steps.plugin.outputs.any_changed }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@v2.20.1
        with:
          egress-policy: audit
      - uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: changed files for plugin
        id: plugin
        uses: step-security/changed-files@v47.0.5
        with:
          files: |
            plugin/**
        continue-on-error: true
  pr_scope_check:
    needs: contains_plugin_changes
    if: ${{ !cancelled() && needs.contains_plugin_changes.outputs.plugin == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@v2.20.1
        with:
          egress-policy: audit
      - name: Check PR Scope and Keywords
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          title="$TITLE"
          contains_major=0
          contains_minor=0

          if [[ $title == *"major"* ]]; then
          contains_major=1
          fi

          if [[ $title == *"minor"* ]]; then
          contains_minor=1
          fi

          if [[ $contains_major -eq 0 && $contains_minor -eq 0 ]]; then
            echo "Error: The identified scope is 'plugin', but the 'major' or 'minor' keyword is missing from the title."
            exit 1
          fi
