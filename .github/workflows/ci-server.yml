name: ci-server
on:
  workflow_call:
jobs:
  ci-server-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache: false
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          # Don't forget to update ci-worker.yml also
          version: v2.7
          working-directory: server
          args: --timeout=5m
  ci-server-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - name: test
        working-directory: server
        run: go test ./... -v -race
  ci-server-check:
    runs-on: ubuntu-latest
    needs: [ci-server-lint, ci-server-test]
    if: always()
    steps:
      - name: Check if all jobs succeeded
        run: |
          if [[ "${{ needs.ci-server-lint.result }}" != "success" ]] || [[ "${{ needs.ci-server-test.result }}" != "success" ]]; then
            echo "Lint or test failed"
            exit 1
          fi
