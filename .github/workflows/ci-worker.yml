name: ci-worker
on:
  workflow_call:
jobs:
  ci-worker-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: worker/go.mod
          cache: false
      - name: golangci-lint
        uses: golangci/golangci-lint-action@1e7e51e771db61008b38414a730f564565cf7c20 # v9.2.0
        with:
          # Don't forget to update ci-server.yml also
          version: v2.7
          working-directory: worker
          args: --timeout=5m
  ci-worker-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: worker/go.mod
          cache-dependency-path: worker/go.sum
      - name: test
        working-directory: worker
        run: go test ./... -v -race
  ci-worker-check:
    runs-on: ubuntu-latest
    needs: [ci-worker-lint, ci-worker-test]
    if: always()
    steps:
      - name: Check if all jobs succeeded
        run: |
          if [[ "${{ needs.ci-worker-lint.result }}" != "success" ]] || [[ "${{ needs.ci-worker-test.result }}" != "success" ]]; then
            echo "Lint or test failed"
            exit 1
          fi
