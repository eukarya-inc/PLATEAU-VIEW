name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      action_type:
        description: "Action type"
        required: true
        type: choice
        options:
          - editor
          - extension
          - geo
          - server
          - tools
          - worker

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      editor-core: ${{ steps.editor-core.outputs.any_changed }}
      editor-server: ${{ steps.editor-server.outputs.any_changed }}
      editor-web: ${{ steps.editor-web.outputs.any_changed }}
      extension: ${{ steps.extension.outputs.any_changed }}
      geo: ${{ steps.geo.outputs.any_changed }}
      server: ${{ steps.server.outputs.any_changed }}
      tools: ${{ steps.tools.outputs.any_changed }}
      worker: ${{ steps.worker.outputs.any_changed }}
      build: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref_name == 'main' }}
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
      - name: changed files for extension
        id: extension
        uses: step-security/changed-files@3dbe17c78367e7d60f00d78ae6781a35be47b4a1 # v45.0.1
        with:
          files: |
            extension/**
            .github/workflows/ci-extension.yml
            .github/workflows/ci-extension-version-update.yml
            .github/workflows/deploy-extension-*.yml
      - name: changed files for server
        id: server
        uses: step-security/changed-files@3dbe17c78367e7d60f00d78ae6781a35be47b4a1 # v45.0.1
        with:
          files: |
            server/**
            .github/workflows/ci-server.yml
            .github/workflows/build-server.yml
            .github/workflows/deploy-server-*.yml
      - name: changed files for tools
        id: tools
        uses: step-security/changed-files@3dbe17c78367e7d60f00d78ae6781a35be47b4a1 # v45.0.1
        with:
          files: |
            tools/**
            .github/workflows/ci-tools.yml
      - name: changed files for geo
        id: geo
        uses: step-security/changed-files@3dbe17c78367e7d60f00d78ae6781a35be47b4a1 # v45.0.1
        with:
          files: |
            geo/**
            .github/workflows/ci-geo.yml
            .github/workflows/build-geo.yml
            .github/workflows/deploy-geo-*.yml
      - name: changed files for worker
        id: worker
        uses: step-security/changed-files@3dbe17c78367e7d60f00d78ae6781a35be47b4a1 # v45.0.1
        with:
          since_last_remote_commit: true
          files: |
            worker/**
            .github/workflows/ci-worker.yml
            .github/workflows/build-worker.yml
            .github/workflows/deploy-worker-*.yml
      - name: changed files for editor - core
        id: editor-core
        uses: step-security/changed-files@3dbe17c78367e7d60f00d78ae6781a35be47b4a1 # v45.0.1
        with:
          since_last_remote_commit: true
          files: |
            editor/core/**
            .github/workflows/ci-editor.yml
            .github/workflows/build-editor.yml
            .github/workflows/deploy-editor-*.yml
      - name: changed files for editor - server
        id: editor-server
        uses: step-security/changed-files@3dbe17c78367e7d60f00d78ae6781a35be47b4a1 # v45.0.1
        with:
          since_last_remote_commit: true
          files: |
            editor/server/**
            .github/workflows/ci-editor.yml
            .github/workflows/build-editor.yml
            .github/workflows/deploy-editor-*.yml
      - name: changed files for editor - web
        id: editor-web
        uses: step-security/changed-files@3dbe17c78367e7d60f00d78ae6781a35be47b4a1 # v45.0.1
        with:
          since_last_remote_commit: true
          files: |
            editor/web/**
            .github/workflows/ci-editor.yml
            .github/workflows/build-editor.yml
            .github/workflows/deploy-editor-*.yml


  # ci-extension-version-update:
  #   needs: prepare
  #   if: ${{ !failure() && needs.prepare.outputs.extension == 'true' && github.event_name == 'push' && github.ref_name == 'main' }}
  #   uses: ./.github/workflows/ci-extension-version-update.yml
  #   with:
  #     commit-sha: ${{ github.sha }}

  ci-editor-core:
    needs: prepare
    if: ${{ needs.prepare.outputs.editor-core == 'true' || inputs.action_type == 'editor' }}
    uses: ./.github/workflows/ci-editor.yml
    with:
      core: 'true'

  ci-editor-server:
    needs: prepare
    if: ${{ needs.prepare.outputs.editor-server == 'true' || inputs.action_type == 'editor' }}
    uses: ./.github/workflows/ci-editor.yml
    with:
      server: 'true'

  ci-editor-web:
    needs: prepare
    if: ${{ needs.prepare.outputs.editor-web == 'true' || inputs.action_type == 'editor' }}
    uses: ./.github/workflows/ci-editor.yml
    with:
      web: 'true'

  ci-extension:
    needs:
      - prepare
      # - ci-extension-version-update
    if: needs.prepare.outputs.extension == 'true' || inputs.action_type == 'extension'
    uses: ./.github/workflows/ci-extension.yml

  ci-tools:
    needs: prepare
    if: needs.prepare.outputs.tools == 'true' || inputs.action_type == 'tools'
    uses: ./.github/workflows/ci-tools.yml
    with:
      release_tools: ${{ github.event_name == 'push' && github.ref_name == 'main' }}

  ci-geo:
    needs: prepare
    if: needs.prepare.outputs.geo == 'true' || inputs.action_type == 'geo'
    uses: ./.github/workflows/ci-geo.yml

  ci-server:
    needs: prepare
    if: needs.prepare.outputs.server == 'true' || inputs.action_type == 'server'
    uses: ./.github/workflows/ci-server.yml

  ci-worker:
    needs: prepare
    if: ${{ needs.prepare.outputs.worker == 'true' || inputs.action_type == 'worker' }}
    uses: ./.github/workflows/ci-worker.yml

  ci:
    runs-on: ubuntu-latest
    needs:
      - ci-extension
      - ci-geo
      - ci-server
      - ci-tools
      - ci-worker
    if: always()
    steps:
      - run: |
          results="${{ toJSON(needs.*.result) }}"
          if echo "$results" | grep -q "failure"; then
            echo "One or more CI jobs failed"
            exit 1
          fi
          if echo "$results" | grep -q "cancelled"; then
            echo "One or more CI jobs were cancelled"
            exit 1
          fi
          echo OK

  deploy-extension-dev:
    needs: [prepare, ci-extension]
    if: ${{ success() && needs.prepare.outputs.build == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch deployment
        uses: peter-evans/repository-dispatch@v2
        with:
          event-type: deploy-extension-dev

  build-geo:
    needs: [prepare]
    if: ${{ !failure() && needs.prepare.outputs.geo == 'true' && needs.prepare.outputs.build == 'true' }}
    uses: ./.github/workflows/build-geo.yml

  push-geo:
    needs: [prepare, ci-geo, build-geo]
    if: ${{ !failure() && needs.ci-geo.result == 'success' && needs.build-geo.result == 'success' && needs.prepare.outputs.build == 'true' }}
    uses: ./.github/workflows/push-image.yml
    with:
      build_tag: ${{ needs.build-geo.outputs.image }}
      latest_tag: ${{ needs.build-geo.outputs.latest_tag }}

  deploy-geo-dev:
    needs: push-geo
    if: ${{ always() && needs.push-geo.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch deployment
        uses: peter-evans/repository-dispatch@v2
        with:
          event-type: deploy-geo-dev

  build-server:
    needs: [prepare]
    if: ${{ !failure() && needs.prepare.outputs.server == 'true' && needs.prepare.outputs.build == 'true' }}
    uses: ./.github/workflows/build-server.yml

  push-server:
    needs: [prepare, ci-server, build-server]
    if: ${{ !failure() && needs.ci-server.result == 'success' && needs.build-server.result == 'success' && needs.prepare.outputs.build == 'true' }}
    uses: ./.github/workflows/push-image.yml
    with:
      build_tag: ${{ needs.build-server.outputs.image }}
      latest_tag: ${{ needs.build-server.outputs.latest_tag }}

  deploy-server-dev:
    needs: push-server
    if: ${{ always() && needs.push-server.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch deployment
        uses: peter-evans/repository-dispatch@v2
        with:
          event-type: deploy-server-dev

  build-worker:
    needs: [prepare]
    if: ${{ !failure() && needs.prepare.outputs.worker == 'true' && needs.prepare.outputs.build == 'true' }}
    uses: ./.github/workflows/build-worker.yml

  push-worker:
    needs: [prepare, ci-worker, build-worker]
    if: ${{ !failure() && needs.ci-worker.result == 'success' && needs.build-worker.result == 'success' && needs.prepare.outputs.build == 'true' }}
    uses: ./.github/workflows/push-image.yml
    with:
      build_tag: ${{ needs.build-worker.outputs.image }}
      latest_tag: ${{ needs.build-worker.outputs.latest_tag }}

  deploy-worker-dev:
    needs: push-worker
    if: ${{ always() && needs.push-worker.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch deployment
        uses: peter-evans/repository-dispatch@v2
        with:
          event-type: deploy-worker-dev

  build-editor-core:
    needs:
      - prepare
      - ci-editor-core
    if: ${{ !failure() && needs.ci-editor-core.result == 'success' && needs.prepare.outputs.build == 'false' }}
    uses: ./.github/workflows/build-editor.yml
    with:
      core: 'true'
    secrets: inherit

  build-editor-server:
    needs:
      - prepare
      - ci-editor-server
    if: ${{ !failure() && needs.ci-editor-server.result == 'success' && needs.prepare.outputs.build == 'true' }}
    uses: ./.github/workflows/build-editor.yml
    with:
      server: 'true'
    secrets: inherit

  deploy-editor-server-dev:
    needs: build-editor-server
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch deployment
        uses: peter-evans/repository-dispatch@v2
        with:
          event-type: deploy-editor-server-dev

  build-editor-web:
    needs:
      - prepare
      - ci-editor-web
    if: ${{ !failure() && needs.ci-editor-web.result == 'success' && needs.prepare.outputs.build == 'true' }}
    uses: ./.github/workflows/build-editor.yml
    with:
      web: 'true'
    secrets: inherit

  deploy-editor-web-dev:
    needs: build-editor-web
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch deployment
        uses: peter-evans/repository-dispatch@v2
        with:
          event-type: deploy-editor-web-dev
