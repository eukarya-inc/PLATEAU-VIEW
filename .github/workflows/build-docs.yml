name: build-docs
on:
  workflow_call:
    outputs:
      image:
        value: ${{ jobs.build-docs.outputs.image }}
      latest_tag:
        value: ${{ jobs.build-docs.outputs.latest_tag }}

jobs:
  build-docs:
    runs-on: ubuntu-latest
    env:
      IMAGE_NAME: ghcr.io/eukarya-inc/plateau-view/plateauview-docs
    outputs:
      image: ${{ steps.set-tags.outputs.build_tag }}
      latest_tag: ${{ steps.set-tags.outputs.latest_tag }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@v2.20.1
        with:
          egress-policy: audit
      - name: Set tags
        id: set-tags
        run: |
          echo "build_tag=${{ env.IMAGE_NAME }}:build-${{ github.sha }}" >> $GITHUB_OUTPUT
          echo "latest_tag=${{ env.IMAGE_NAME }}:latest" >> $GITHUB_OUTPUT
      - name: Checkout
        uses: actions/checkout@v6.0.2
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.0.0
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4.1.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push docker image with temporary tag
        uses: docker/build-push-action@v7.1.0
        with:
          context: ./docs
          platforms: linux/amd64
          tags: ${{ steps.set-tags.outputs.build_tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          push: true
