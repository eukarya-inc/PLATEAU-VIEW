name: ⭐️ Deploy PLATEAU Server dev
on:
  workflow_call:
  workflow_dispatch:
  repository_dispatch:
    types: [deploy-server-dev]
env:
  IMAGE: ghcr.io/eukarya-inc/plateau-view/plateauview-api:latest
  IMAGE_GCP: asia-northeast1-docker.pkg.dev/reearth-plateau-dev/reearth-plateau/plateauview-api:latest
jobs:
  deploy_server:
    runs-on: ubuntu-latest
    if: github.event.repository.full_name == 'eukarya-inc/PLATEAU-VIEW'
    environment: dev
    permissions:
      contents: read
      id-token: write
      packages: write
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@v2.20.1
        with:
          egress-policy: audit
      - uses: actions/checkout@v6.0.2
      - uses: google-github-actions/auth@v3.0.0
        with:
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
      - name: Configure docker
        run: gcloud auth configure-docker asia-northeast1-docker.pkg.dev --quiet
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4.1.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: docker pull
        run: docker pull $IMAGE
      - name: docker push
        run: |
          docker tag $IMAGE $IMAGE_GCP
          docker push $IMAGE_GCP
      - name: Deploy server to Cloud Run
        run: |
          gcloud run deploy plateauview-api \
            --image $IMAGE_GCP \
            --region ${{ vars.GCP_REGION }} \
            --platform managed \
            --quiet
      - name: Deploy server job to Cloud Run
        run: |
          gcloud run jobs deploy plateauview-server-job \
            --image $IMAGE_GCP \
            --region ${{ vars.GCP_REGION }} \
            --quiet
      - name: Update asset index job image
        run: |
          # The job is created by Terraform (eukarya-inc/infrastructure). Only the
          # image is updated here, and only once the job exists.
          if gcloud run jobs describe plateauview-asset-index --region ${{ vars.GCP_REGION }} >/dev/null 2>&1; then
            gcloud run jobs update plateauview-asset-index \
              --image $IMAGE_GCP \
              --region ${{ vars.GCP_REGION }} \
              --quiet
          else
            echo "plateauview-asset-index does not exist yet; skipping"
          fi
