name: deploy-cloudflare-tiles
on:
  workflow_call:
  workflow_dispatch:
jobs:
  deploy:
    name: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@v2.20.1
        with:
          egress-policy: audit
      - uses: actions/checkout@v6.0.2
      - uses: actions/setup-node@v6.4.0
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install
        run: npm ci
      - name: Deploy
        run: npm run -w cloudflare/tiles deploy
        env:
          # Account ID is omitted because the API token is scoped to a single
          # account; wrangler resolves it automatically. Pass an explicit
          # CLOUDFLARE_ACCOUNT_ID only if the token gains multi-account scope.
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
