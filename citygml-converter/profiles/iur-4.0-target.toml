# i-UR 4.0 as a conversion *target*. Folded in by every profile that produces it.
#
# This is a *fragment*, not a profile. It is separate from the CityGML fragment
# because it varies on a different axis. The CityGML mapping is fixed at
# 2.0 -> 3.0, while the i-UR target is 4.0 only until i-UR publishes another
# minor. When it does, this file is what gets a sibling -- and each profile then
# names a different one in `base`, instead of the whole shared half being forked.
#
# What belongs here is anything true of producing i-UR 4.0, whichever minor the
# input came from. The code lists are here rather than in the CityGML fragment
# for that reason -- they are the published i-UR 4.0 set.

name = "iur-4.0-target"
description = "The i-UR 4.0 target: namespaces, schema locations and code lists"

[target]
label = "CityGML 3.0 + i-UR 4.0"
citygml = "http://www.opengis.net/citygml/3.0"
iur_version = "4.0"
iur_patch = "4.0.2"
iur = [
  "https://www.geospatial.jp/iur/uro/4.0",
  "https://www.geospatial.jp/iur/urf/4.0",
  "https://www.geospatial.jp/iur/urg/4.0",
  "https://www.geospatial.jp/iur/urt/4.0",
  "https://www.geospatial.jp/iur/urc/4.0",
]

# The i-UR 4.0 output prefixes. The CityGML ones are in `citygml-2.0-to-3.0`.
[output.namespaces]
uro = "https://www.geospatial.jp/iur/uro/4.0"
urf = "https://www.geospatial.jp/iur/urf/4.0"
urg = "https://www.geospatial.jp/iur/urg/4.0"
# Urban Core, new in i-UR 4.0. DataQualityAttribute, DisasterRiskAttribute and
# DmAttribute live here now rather than under uro, but which uro 3.x elements
# moved is not encoded below, so they still convert as uro.
urc = "https://www.geospatial.jp/iur/urc/4.0"
urt = "https://www.geospatial.jp/iur/urt/4.0"

# i-UR resolves into the package's own schemas/, which the converter writes.
# Each path is written from the package root, and every document gains the
# ../ steps back to it from where it sits. The CityGML locations, which are
# remote, are in `citygml-2.0-to-3.0`.
[output.schema_locations]
"https://www.geospatial.jp/iur/uro/4.0" = "schemas/iur/uro/4.0/urbanObject.xsd"
"https://www.geospatial.jp/iur/urc/4.0" = "schemas/iur/urc/4.0/urbanCore.xsd"
"https://www.geospatial.jp/iur/urf/4.0" = "schemas/iur/urf/4.0/urbanFunction.xsd"
"https://www.geospatial.jp/iur/urg/4.0" = "schemas/iur/urg/4.0/statisticalGrid.xsd"
"https://www.geospatial.jp/iur/urt/4.0" = "schemas/iur/urt/4.0/publicTransit.xsd"

# How the input's codelists/ is carried into the output (core/src/convert.rs,
# with the codeSpace rewrites in core/src/common.rs). The published i-UR 4.0
# code lists replace same-named input files. `local` patterns name the lists a
# municipality authors itself, which always survive as shipped, because the
# published set carries template files under some of these names and a template
# must never overwrite real content.
[codelists]
local = [
  "KeyValuePairAttribute_*",
  "*_description.xml",
  "TsunamiRiskAttribute_rankOrg.xml",
  "LandUseDetailAttribute_orgLandUse.xml",
]

# Lists whose values the conversion itself rewrites into the published codes.
# The published file always wins, or the rewritten values would not resolve.
superseded = [
  "Building_lodType.xml",
  "Bridge_lodType.xml",
  "Tunnel_lodType.xml",
  "OtherConstruction_lodType.xml",
  "Road_lodType.xml",
  "Railway_lodType.xml",
  "CityFurniture_lodType.xml",
]

# Files the published 4.0 set carries under a new name, with unchanged codes.
# Every codeSpace naming the old file is rewritten.
[codelists.retarget]
"IntBuildingInstallation_function.xml" = "BuildingInstallation_function.xml"
"BridgeConstructionElement_function.xml" = "BridgeConstructiveElement_function.xml"
"PublicSurveyDataQualityAttribute_publicSurveySrcDesc.xml" = "PublicSurveyDataQualityAttribute_geometrySrcDesc.xml"
"BuildingDataQualityAttribute_lod1HeightType.xml" = "DataQualityAttribute_lod1HeightType.xml"
# Renames verified by content, so the published 4.0 file under the new name
# defines the identical code/label set as 2.0-era packages ship under the old
# one (fireproofStructureType additionally carries every code observed in real
# data under the old name).
"Building_fireproofStructureType.xml" = "BuildingDetailAttribute_fireproofStructureType.xml"
"Common_sex.xml" = "Common_Sex.xml"
"LengthAttribute_mesureType.xml" = "LengthAttribute_measureType.xml"

# Retargets that hold under one feature type only. CityGML 3.0 declares
# `class` on each transportation type, and the 4.0 set publishes one class
# list per type. The shared list stays on Track, Square and Waterway, whose
# codes the per-type lists do not carry.
[codelists.retarget_by_type."tran:Road"]
"TransportationComplex_class.xml" = "Road_class.xml"
[codelists.retarget_by_type."tran:Railway"]
"TransportationComplex_class.xml" = "Railway_class.xml"

# Codes the published lists no longer define. The values are kept and
# reported. 898 means "unknown source", which no surviving code expresses.
[codelists.kept_codes]
"DataQualityAttribute_thematicSrcDesc.xml" = ["898"]

# The one child i-UR 4.0 requires on a data quality attribute.
#
# urc:DataQualityAttribute records provenance per LOD, and geometrySrcDescLod1
# is the only one of its sixteen children that is mandatory. A source that
# records provenance without an LOD leaves it empty, so the converter supplies
# the "not created" code, which is what the specification prescribes for a
# feature with no LOD1 geometry to describe. Every substitution is reported.
#
# `classes` are the concrete classes carrying the requirement, `child` the
# element to supply, and `after` the children it must follow, since the type is
# a sequence. `code_space` is written from the package root, like every
# code list path in this file.
[quality]
classes = [
  "urc:DataQualityAttribute",
  "urc:ExteriorDataQualityAttribute",
  "urc:InteriorDataQualityAttribute",
]
child = "urc:geometrySrcDescLod1"
value = "999"
code_space = "codelists/DataQualityAttribute_geometrySrcDesc.xml"
after = ["urc:geometrySrcDescLod0"]

# ---------------------------------------------------------------------------
# Urban function module. An urban function area is a thematic surface, and its
# LOD1 multi-surface moves to core. The cabinet-order facility classes i-UR 4.0
# no longer declares become urf:UrbanFacilityStipulatedByCabinetOrder, told
# apart by the urf:function they already carry, and the district facility
# subclasses become urf:DistrictFacility the same way.
# ---------------------------------------------------------------------------
[[element]]
from = "urf:lod1MultiSurface"
to = "core:lod1MultiSurface"
[[element]]
from = "urf:TelecommunicationFacility"
to = "urf:UrbanFacilityStipulatedByCabinetOrder"
[[element]]
from = "urf:WindProtectionFacility"
to = "urf:UrbanFacilityStipulatedByCabinetOrder"
[[element]]
from = "urf:FireProtectionFacility"
to = "urf:UrbanFacilityStipulatedByCabinetOrder"
[[element]]
from = "urf:TideFacility"
to = "urf:UrbanFacilityStipulatedByCabinetOrder"
[[element]]
from = "urf:FloodPreventionFacility"
to = "urf:UrbanFacilityStipulatedByCabinetOrder"
[[element]]
from = "urf:SnowProtectionFacility"
to = "urf:UrbanFacilityStipulatedByCabinetOrder"
[[element]]
from = "urf:SandControlFacility"
to = "urf:UrbanFacilityStipulatedByCabinetOrder"
[[element]]
from = "urf:RuralDistrictFacility"
to = "urf:DistrictFacility"
[[element]]
from = "urf:RoadsideDistrictFacility"
to = "urf:DistrictFacility"

# ---------------------------------------------------------------------------
# Other constructions. i-UR 3.x declares the class, its boundary surfaces and
# its construction properties in uro, and CityGML 3.0 declares them in con and
# core. Its installations keep their i-UR class, renamed, and move into the
# structure attribute (core/src/cons.rs). Names `uro` 3.x reuses on other
# classes take the parent they hold under.
# ---------------------------------------------------------------------------
[[element]]
from = "uro:OtherConstruction"
to = "con:OtherConstruction"
[[element]]
from = "uro:class"
to = "con:class"
parent = "uro:OtherConstruction"
[[element]]
from = "uro:function"
to = "con:function"
parent = "uro:OtherConstruction"
[[element]]
from = "uro:usage"
to = "con:usage"
parent = "uro:OtherConstruction"
[[element]]
from = "uro:elevation"
to = "con:elevation"
parent = "uro:OtherConstruction"
[[element]]
from = "uro:height"
to = "con:height"
parent = "uro:OtherConstruction"
[[element]]
from = "uro:conditionOfConstruction"
to = "con:conditionOfConstruction"
[[element]]
from = "uro:dateOfConstruction"
to = "con:dateOfConstruction"
[[element]]
from = "uro:dateOfDemolition"
to = "con:dateOfDemolition"
[[element]]
from = "uro:Height"
to = "con:Height"
[[element]]
from = "uro:value"
to = "con:value"
parent = "uro:Height"
[[element]]
from = "uro:status"
to = "con:status"
parent = "uro:Height"
[[element]]
from = "uro:lowReference"
to = "con:lowReference"
parent = "uro:Height"
[[element]]
from = "uro:highReference"
to = "con:highReference"
parent = "uro:Height"
[[element]]
from = "uro:Elevation"
to = "con:Elevation"
[[element]]
from = "uro:elevationReference"
to = "con:elevationReference"
parent = "uro:Elevation"
[[element]]
from = "uro:elevationValue"
to = "con:elevationValue"
parent = "uro:Elevation"
[[element]]
from = "uro:constructionEvent"
to = "con:constructionEvent"
parent = "uro:OtherConstruction"
[[element]]
from = "uro:ConstructionEvent"
to = "con:ConstructionEvent"
[[element]]
from = "uro:event"
to = "con:event"
parent = "uro:ConstructionEvent"
[[element]]
from = "uro:dateOfEvent"
to = "con:dateOfEvent"
parent = "uro:ConstructionEvent"
[[element]]
from = "uro:description"
to = "con:description"
parent = "uro:ConstructionEvent"
[[element]]
from = "uro:occupancy"
to = "con:occupancy"
parent = "uro:OtherConstruction"
[[element]]
from = "uro:Occupancy"
to = "core:Occupancy"
[[element]]
from = "uro:numberOfOccupants"
to = "core:numberOfOccupants"
parent = "uro:Occupancy"
[[element]]
from = "uro:interval"
to = "core:interval"
parent = "uro:Occupancy"
[[element]]
from = "uro:occupantType"
to = "core:occupantType"
parent = "uro:Occupancy"
[[element]]
from = "uro:boundedBy"
to = "core:boundary"
[[element]]
from = "uro:RoofSurface"
to = "con:RoofSurface"
[[element]]
from = "uro:WallSurface"
to = "con:WallSurface"
[[element]]
from = "uro:GroundSurface"
to = "con:GroundSurface"
[[element]]
from = "uro:OuterCeilingSurface"
to = "con:OuterCeilingSurface"
[[element]]
from = "uro:OuterFloorSurface"
to = "con:OuterFloorSurface"
[[element]]
from = "uro:ClosureSurface"
to = "core:ClosureSurface"
[[element]]
from = "uro:lod2MultiSurface"
to = "core:lod2MultiSurface"
[[element]]
from = "uro:lod3MultiSurface"
to = "core:lod3MultiSurface"
[[element]]
from = "uro:ConstructionInstallation"
to = "uro:OtherConstructionInstallation"

# The construction rewrites' rows for other constructions. See
# [construction] in citygml-2.0-to-3.0.
[construction.lod_geometry]
"con:OtherConstruction" = "uro"
"uro:OtherConstructionInstallation" = "uro"

# An other construction's old LOD3 is LOD2. See [lod_map] in
# citygml-2.0-to-3.0.
[lod_map."con:OtherConstruction"]
"3" = "2"

# ---------------------------------------------------------------------------
# The lodType codes of each feature type, keyed by the type.
#
# list is the published code list the type's codes belong to, and a codeSpace
# naming one of cited_as is pointed at it. map rewrites a plain 2.0-era code to
# its published form. drop names the codes removed, each with its label. A code
# in neither is kept and reported, unless it is already one the table publishes.
# 4.x codes are left to the LOD4 fold. moved names, per old LOD that
# [lod_map] moves, the code a feature is given when that LOD moved and the
# feature carries no code of it. It replaces the first code the move dropped.
# kept names, per old LOD of a type [lod_map] lists, the code a feature with
# geometry at that LOD is given once the moves are done, when it carries no
# code of that LOD.
# folded gives, per side and keyed by the LOD the LOD4 content folded into, the
# code a feature is given when its LOD4 folded and it carries no 4.x code. split
# applies when any folded geometry of that side sits on a boundary surface, and
# whole otherwise. interior maps a 4.x code, then the LOD the interior model
# folds into, to its published code. A 4.x code listed under one LOD only sends
# the interior model there whatever its measurement code says, and a code with
# no entry at the decided LOD is dropped. A type without interior writes
# <lod>.x_interior.
# ---------------------------------------------------------------------------
[lod_types."bldg:Building"]
list = "Building_lodType.xml"
drop = { "8" = "不明" }

[lod_types."bldg:Building".map]
"0.0" = "0.0_exterior"
"0.1" = "0.1_exterior"
"1.0" = "1.0_exterior"
"1.1" = "1.1_exterior"
"2.0" = "2.0_exterior"
"2.1" = "2.1_exterior"
"2.2" = "2.2_exterior"
"2.3" = "2.3_exterior"
"3.0" = "2.0_exterior"
"3.1" = "2.1_exterior"
"3.2" = "2.2_exterior"
"3.3" = "2.3_exterior"

[lod_types."bldg:Building".moved]
"3" = "2.0_exterior"

[lod_types."uro:UndergroundBuilding"]
list = "UndergroundBuilding_lodType.xml"
cited_as = ["Building_lodType.xml"]
drop = { "8" = "不明" }

[lod_types."uro:UndergroundBuilding".map]
"0.0" = "0.0_exterior"
"0.1" = "0.1_exterior"
"1.0" = "1.0_exterior"
"1.1" = "1.1_exterior"
"2.0" = "2.0_exterior"
"2.1" = "2.1_exterior"
"2.2" = "2.2_exterior"
"2.3" = "2.3_exterior"
"3.0" = "3.0_exterior"
"3.1" = "3.1_exterior"

[lod_types."brid:Bridge"]
list = "Bridge_lodType.xml"
cited_as = ["Building_lodType.xml"]
drop = { "8" = "不明" }

[lod_types."brid:Bridge".map]
"2.0" = "2.0_exterior"
"2.1" = "2.1_exterior"
"3.0" = "2.1_exterior"

[lod_types."brid:Bridge".moved]
"3" = "2.1_exterior"

[lod_types."brid:Bridge".folded.exterior]
"3" = { whole = "3.0_exterior", split = "3.1_exterior" }

[lod_types."brid:Bridge".folded.interior]
"3" = { whole = "3.0_interior", split = "3.1_interior" }

[lod_types."wtr:WaterBody"]
list = "WaterBody_lodType.xml"
drop = { "3.0" = "未定義", "3.1" = "未定義" }

[lod_types."wtr:WaterBody".moved]
"3" = "2.1"

[lod_types."wtr:WaterBody".kept]
"2" = "2.0"

[lod_types."tun:Tunnel"]
list = "Tunnel_lodType.xml"

[lod_types."tun:Tunnel".moved]
"3" = "2.0_exterior"

[lod_types."tun:Tunnel".interior]
"4.0" = { "2" = "2.0_interior" }
"4.1" = { "2" = "2.1_interior", "3" = "3.1_interior" }
"4.2" = { "2" = "2.2_interior", "3" = "3.1_interior" }

[lod_types."con:OtherConstruction"]
list = "OtherConstruction_lodType.xml"

[lod_types."con:OtherConstruction".map]
"3.0" = "2.1"
"3.1" = "2.1"

[lod_types."frn:CityFurniture"]
list = "CityFurniture_lodType.xml"
drop = { "8" = "不明" }

[lod_types."frn:CityFurniture".map]
"3.0" = "2.1"
"3.1" = "2.2"

[lod_types."frn:CityFurniture".moved]
"3" = "2.1"

[lod_types."frn:CityFurniture".kept]
"2" = "2.0"

[lod_types."veg:SolitaryVegetationObject"]
list = "Vegetation_lodType.xml"

[lod_types."veg:SolitaryVegetationObject".moved]
"3" = "2.1"

[lod_types."veg:SolitaryVegetationObject".kept]
"2" = "2.0"

[lod_types."veg:PlantCover"]
list = "Vegetation_lodType.xml"

[lod_types."veg:PlantCover".moved]
"3" = "2.1"

[lod_types."veg:PlantCover".kept]
"2" = "2.0"

# ---------------------------------------------------------------------------
# What the transportation rewrite (core/src/tran.rs) supplies.
#
# full_width_function is the function code of the TrafficArea minted for an
# object's own full-width surface, per feature type. A TrafficSpace is a lane
# when the area it bounds has function lane_function, or when the object's
# lodType is one of lane_lod_types for the list it cites, and a way otherwise.
# Auxiliary spaces and the minted full-width space are always a way.
# lod_type_map rewrites lodType per code list, and a code with no entry is
# dropped.
#
# clearance is the height in metres a type's LOD1 spaces are extruded by when
# a run asks for the extrusion and names no height of its own. Railway and
# Waterway have no default and are extruded only on a named height.
# clearance_lod_type is the code an extruded feature of that type gains beside
# its mapped lodType.
# ---------------------------------------------------------------------------
[tran]
function_code_space = "codelists/TrafficArea_function.xml"
lane_function = "1010"

[tran.full_width_function]
"tran:Road" = "1140"
"tran:Square" = "1140"
"tran:Track" = "2040"
"tran:Railway" = "8200"
"tran:Waterway" = "9000"

[tran.lane_lod_types]
"Road_lodType.xml" = ["3.2", "3.3", "3.4"]

[tran.lod_type_map."Road_lodType.xml"]
"3.0" = "2.0"
"3.1" = "2.0"
"3.2" = "2.1"
"3.3" = "2.2"
"3.4" = "2.2"

[tran.lod_type_map."Railway_lodType.xml"]
"3.0" = "2.0"
"3.1" = "2.1"
"3.2" = "2.2"

[tran.clearance]
"tran:Road" = 4.5
"tran:Square" = 4.5
"tran:Track" = 2.5

[tran.clearance_lod_type."tran:Railway"]
traffic = "1.0"
auxiliary = "1.1"

# ---------------------------------------------------------------------------
# What the underground utility rewrite (core/src/unf.rs) does with a feature's
# Dm attributes after copying their geometry into the feature's LOD0.
#
# dm is "drop" to remove every Dm attribute from the feature, or "keep" to
# leave them beside the copied LOD0. `--unf-dm` overrides it per run.
# ---------------------------------------------------------------------------
[unf]
dm = "drop"

# ---------------------------------------------------------------------------
# The water body rewrite (core/src/wtr.rs).
#
# lod1_surface maps each feature type whose LOD1 multi-surface moves into a
# new boundary surface to the type of that surface.
# ---------------------------------------------------------------------------
[wtr]
lod1_surface = { "wtr:WaterBody" = "wtr:WaterSurface" }

# ---------------------------------------------------------------------------
# The city furniture rewrite (core/src/frn.rs).
#
# lod1_surface maps each feature type whose LOD1 surface moves into an i-UR
# extension to the class holding it. The class goes in the type's
# adeOf<Type> property and holds the surface as its lod1MultiSurface.
# ---------------------------------------------------------------------------
[frn]
lod1_surface = { "frn:CityFurniture" = "uro:CityFurnitureExtendedGeometry" }

# ---------------------------------------------------------------------------
# The urban function rewrite (core/src/urf.rs).
#
# removed lists the geometry properties taken off every urban function
# feature. A feature they leave without a geometry property is dropped.
# ---------------------------------------------------------------------------
[urf]
removed = [
  "urf:lod-2MultiCurve",
  "urf:lod-2MultiPoint",
  "urf:lod-1MultiCurve",
  "urf:lod-1MultiPoint",
  "urf:lod0MultiPoint",
  "urf:lod0MultiSurface",
  "urf:lod1MultiCurve",
]

# ---------------------------------------------------------------------------
# Complex types the converter reads with another xs:extension base, for child
# order and ADE hooks. An override applies while the vendored schema still
# declares the base named in replaces, and does nothing once it declares any
# other.
# ---------------------------------------------------------------------------
[schema_override."urf:AbstractDistrictPlanType"]
replaces = "gml:AbstractFeatureType"
base = "urf:ZoneType"
