[package]
name = "tile"
version = "0.1.0"
edition = "2024"
description = "High-performance tile server with COG overlay support"
license = "Apache-2.0"

[dependencies]
# Web framework
axum = "0.8"
tokio = { version = "1", features = ["full"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace"] }
hyper = { version = "1", features = ["server", "http1", "http2"] }
http = "1"
hyper-util = { version = "0.1", features = ["server", "server-auto", "tokio"] }

# COG reading (async-cog style)
# Using git commit for read_next_ifd support (faster metadata loading)
async-tiff = { git = "https://github.com/developmentseed/async-tiff", rev = "dd8f2d0f" }
object_store = { version = "0.12", default-features = false, features = ["http", "gcp", "aws", "fs"] }
bytes = "1"

# Image processing
image = { version = "0.25", default-features = false, features = ["png", "webp", "avif"] }

# Terrain generation
flate2 = "1"
japan-geoid = { version = "0.6", features = ["gsigeo2011", "jpgeo2024", "jpgeo2024_hrefconv2024"] }
terrain-codec = "0.3.0"
# Pin pmtiles to =0.23.0 because 0.23.1 bumped its internal object_store
# dep to 0.14 while our `object_store_pmtiles` alias below is on 0.13.
# Mixing the two versions produces `Path: From<Path>` trait errors at build
# time (the two crate versions define distinct `Path` types). If you upgrade
# pmtiles past 0.23.0, bump `object_store_pmtiles` in lockstep.
pmtiles = { version = "=0.23.0", default-features = false, features = ["http-async", "object-store", "reqwest-rustls"] }
rstar = "0.12"
# pmtiles needs object_store v0.13; the existing /tile/src/cog/* still uses
# v0.12. We expose v0.13 under a rename so both coexist in the build.
object_store_pmtiles = { package = "object_store", version = "0.13", default-features = false, features = ["http", "gcp", "aws", "fs"] }

# HTTP client
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Error handling
thiserror = "2"
anyhow = "1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-stackdriver = { version = "0.10", features = ["opentelemetry"] }
tracing-opentelemetry = "0.23"
opentelemetry = "0.22"
opentelemetry_sdk = { version = "0.22", features = ["rt-tokio"] }

# Async utilities
futures = "0.3"
async-trait = "0.1"

# Cache
moka = { version = "0.12", features = ["future"] }

# URL parsing
url = "2"

# Hashing
xxhash-rust = { version = "0.8", features = ["xxh64"] }

# MapLibre style rendering (optional, requires Linux)
maplibre_native = { version = "0.5", features = ["pool", "vulkan"], optional = true }

[features]
default = []
maplibre = ["maplibre_native"]

[dev-dependencies]
tokio-test = "0.4"
tempfile = "3"
wiremock = "0.6"
portpicker = "0.1"
tiff = "0.9"

[profile.release]
lto = true
codegen-units = 1
strip = true
