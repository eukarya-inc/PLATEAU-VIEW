[package]
name = "tile"
version = "0.1.0"
edition = "2024"
description = "High-performance tile server with COG overlay support"
license = "Apache-2.0"

[dependencies]
# Web framework
axum = "0.8"
tokio = { version = "1", features = ["full"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace"] }
hyper = { version = "1", features = ["server", "http1", "http2"] }
http = "1"
hyper-util = { version = "0.1", features = ["server", "server-auto", "tokio"] }

# COG reading (async-cog style)
# `webp` pulls upstream's libwebp-backed decoder for GDAL's private WebP
# compression tag (50001) — see src/cog/reader.rs. `default-features = false`
# drops async-tiff's optional `reqwest` backend: every reader here is opened
# over an `object_store`, so that backend would only add an HTTP client we
# never call. It costs no extra reqwest major either way — async-tiff's is
# 0.13, which pmtiles already pulls in.
async-tiff = { version = "0.3", default-features = false, features = ["object_store", "webp"] }
object_store = { version = "0.13", default-features = false, features = ["http", "gcp", "aws", "fs"] }
bytes = "1"

# Image processing
image = { version = "0.25", default-features = false, features = ["png", "webp", "avif"] }

# Terrain generation
flate2 = "1"
japan-geoid = { version = "0.6", features = ["gsigeo2011", "jpgeo2024", "jpgeo2024_hrefconv2024"] }
terrain-codec = "0.3.0"
# pmtiles is pinned exactly because 0.23.1 moved to object_store ^0.14, while
# async-tiff 0.3 and the COG/cache code here are on 0.13 — a caret range would
# silently pull 0.23.1 and split the tree into two incompatible object_store
# majors again. To take a newer pmtiles, move `object_store` above in lockstep
# and port src/cog/reader.rs, src/terrain/pmtiles.rs and src/tile/pmtiles.rs.
pmtiles = { version = "=0.23.0", default-features = false, features = ["http-async", "object-store", "reqwest-rustls"] }
rstar = "0.12"

# HTTP client
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Error handling
thiserror = "2"
anyhow = "1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-stackdriver = { version = "0.10", features = ["opentelemetry"] }
tracing-opentelemetry = "0.23"
opentelemetry = "0.22"
opentelemetry_sdk = { version = "0.22", features = ["rt-tokio"] }

# Async utilities
futures = "0.3"
async-trait = "0.1"

# Cache
moka = { version = "0.12", features = ["future"] }

# URL parsing
url = "2"

# Hashing
xxhash-rust = { version = "0.8", features = ["xxh64"] }

# MapLibre style rendering (optional, requires Linux)
maplibre_native = { version = "0.5", features = ["pool", "vulkan"], optional = true }

[features]
default = []
maplibre = ["maplibre_native"]

[dev-dependencies]
tokio-test = "0.4"
tempfile = "3"
wiremock = "0.6"
portpicker = "0.1"
tiff = "0.9"

[profile.release]
lto = true
codegen-units = 1
strip = true
