[package]
name = "tile"
version = "0.1.0"
edition = "2024"
description = "High-performance tile server with COG overlay support"
license = "Apache-2.0"

[dependencies]
# Web framework
axum = "0.8"
tokio = { version = "1", features = ["full"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace"] }
hyper = { version = "1", features = ["server", "http1", "http2"] }
http = "1"
hyper-util = { version = "0.1", features = ["server", "server-auto", "tokio"] }

# COG reading (async-cog style)
async-tiff = "0.1"
object_store = { version = "0.12", default-features = false, features = ["http", "gcp", "aws"] }

# Image processing
image = { version = "0.25", default-features = false, features = ["png"] }

# HTTP client
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Error handling
thiserror = "2"
anyhow = "1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Async utilities
futures = "0.3"
async-trait = "0.1"

# Cache
moka = { version = "0.12", features = ["future"] }

# URL parsing
url = "2"

[dev-dependencies]
tokio-test = "0.4"
tempfile = "3"
wiremock = "0.6"
portpicker = "0.1"
tiff = "0.9"

[profile.release]
lto = true
codegen-units = 1
strip = true
