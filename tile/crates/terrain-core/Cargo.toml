[package]
name = "terrain-core"
version = "0.1.0"
edition = "2024"
description = "Pure, synchronous terrain primitives shared by the PLATEAU tile server and its WebAssembly build"
license = "Apache-2.0"
publish = false

# No runtime dependencies: this crate must build for wasm32-unknown-unknown
# and stay free of I/O, async runtimes and clocks.
[dependencies]

[dev-dependencies]
# Fixture parsing only (golden vectors / golden nodes).
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Size probe for the wasm32 CI job (see the file); not an API.
[[example]]
name = "wasm_size"
crate-type = ["cdylib"]

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-test = "0.3"
